<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>오늘 덮어쓰기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one airy column. Cards appear one at a time: write → swipe to cover → rewrite. A sunny quote card opens the page once the day is finished.
   Deliberately a single bright theme (the user asked for a bright mood). */
:root {
  color-scheme: light;
  --bg: #f2f7fb;
  --paper: #ffffff;
  --fg: #23303d;
  --muted: #6c7a88;
  --line: #d6e2ec;
  --sky: #3f8fd8;
  --sky-soft: #e2effa;
  --sun: #ffd95a;
  --sun-soft: #fff6cf;
  --ink: #15191e;
  --chalk: #fbe9a6;
  --font-display: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --font-quote: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Nanum Pen Script", "Gaegu", cursive;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-direction: column; gap: 6px; }
.date { font-size: 13px; color: var(--sky); font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.25; margin: 0; text-wrap: balance; }
h1 .mark { background: linear-gradient(transparent 58%, var(--sun) 58%, var(--sun) 92%, transparent 92%); padding: 0 2px; }
.lede { margin: 0; color: var(--muted); max-width: 46ch; }

/* quote */
.quote { background: var(--sun-soft); border: 1px solid #f3dd85; border-radius: 18px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px; animation: rise .6s ease both; }
.quote .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: #9a7a10; }
.quote blockquote { margin: 0; font-family: var(--font-quote); font-size: 19px; line-height: 1.65; word-break: keep-all; }
.quote cite { font-style: normal; font-size: 13px; color: var(--muted); }
.quote .row-btn { display: flex; gap: 8px; flex-wrap: wrap; }

.status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); }
.dots i.on { background: var(--ink); border-color: var(--ink); }
.dots i.wip { border-color: var(--sky); }

.hint { margin: 0; font-size: 14px; background: var(--sky-soft); color: #1f5d96; border-radius: 12px; padding: 10px 14px; }

ol.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.card { position: relative; min-width: 0; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; transition: background .35s ease, border-color .35s ease; box-shadow: 0 1px 0 rgba(35,48,61,.04); }
.card .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card textarea { display: block; width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit; resize: none; padding: 6px 14px 12px; min-height: 48px; line-height: 1.55; overflow: hidden; }
.card textarea:focus { outline: none; }
.card.write:focus-within { border-color: var(--sky); }
.card .foot { display: flex; justify-content: flex-end; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }

.strip { position: relative; min-height: 58px; }
.strip .neg { margin: 0; padding: 8px 14px 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; user-select: none; -webkit-user-select: none; }
.strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
.card.written { border: 1.5px dashed var(--muted); }
.swipe-cue { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--ink) 0 20%, transparent 20%); background-size: 200% 100%; opacity: .25; animation: cue 1.8s ease-in-out infinite; pointer-events: none; }
@keyframes cue { from { background-position: 100% 0; } to { background-position: -25% 0; } }

.card.inked { background: var(--ink); border-color: var(--ink); }
.card.inked .top { color: #8d96a0; }
.card .pos { color: var(--chalk); font-family: var(--font-hand); font-size: 26px; line-height: 1.3; padding: 4px 14px 10px; animation: rise .5s ease both; }
.card .pos::placeholder { color: rgba(251,233,166,.45); }
.card.inked:focus-within { border-color: var(--chalk); }
.peek { margin: 0 14px 12px; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.08); color: #b7c0c9; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.peek b { display: block; font-size: 11px; letter-spacing: .06em; color: #8d96a0; font-weight: 600; margin-bottom: 2px; }
.card.inked .chip { color: #c5ccd3; }
.card.inked .chip:hover { color: var(--chalk); }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

button { font: inherit; font-size: 14px; font-weight: 500; border-radius: 999px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--fg); }
button.primary { background: var(--sky); color: #fff; border-color: var(--sky); }
button.done-btn { background: var(--sun); border-color: #f0c93a; color: #3b2f00; font-weight: 600; }
button:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.chip { background: transparent; border: 0; color: var(--muted); font-size: 12.5px; padding: 4px 8px; border-radius: 6px; }
.chip:hover { color: var(--fg); }
.chip.go { background: var(--sky); color: #fff; padding: 6px 14px; border-radius: 999px; font-weight: 500; }
.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

section.history { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 22px; }
section.history h2 { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.day { display: flex; flex-direction: column; gap: 6px; }
.day .d { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.day li button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; background: var(--ink); color: var(--chalk); font-family: var(--font-hand); font-size: 21px; line-height: 1.3; border-radius: 8px; padding: 5px 12px; overflow-wrap: anywhere; }
.day li button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.day li button.empty { color: rgba(251,233,166,.45); }
.day li .orig { display: block; font-family: var(--font-body); font-size: 13px; color: #b7c0c9; margin-top: 2px; }
.none { margin: 0; font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="date" id="date"></div>
    <h1>오늘 <span class="mark">덮어쓰기</span></h1>
    <p class="lede">싫었던 일을 하나 적고, 손가락으로 까맣게 덮고, 그 위에 바랐던 장면을 다시 써요. 하루 최대 다섯 개, 하나만 해도 괜찮아요.</p>
  </header>

  <div class="quote" id="quote" hidden></div>

  <div class="status"><div class="dots" id="dots"></div><span id="statusText"></span></div>
  <p class="hint" id="hint"></p>
  <ol class="list" id="list"></ol>
  <div class="actions" id="actions"></div>

  <section class="history">
    <h2>지난 날들</h2>
    <div id="history"></div>
  </section>
</div>

<script>
(function () {
  const KEY = 'overwrite-today-v2';
  const OLD_KEY = 'overwrite-today-v1';
  const MAX = 5;
  const SAMPLE = '팀장님이 회의에서 내 의견을 끝까지 듣지도 않고 넘겨버렸다';

  // 공개 저작물(옛 고전) 문장은 번역해서 싣고, 확언은 이 앱을 위해 새로 쓴 문장입니다.
  const QUOTES = [
    { t: '하루를 마쳤으면 그것으로 끝내세요. 당신은 할 수 있는 만큼 했습니다. 실수와 어리석은 일이 끼어들었을지 몰라도, 되도록 빨리 잊으세요. 내일은 새로운 날입니다.', s: '랄프 왈도 에머슨, 딸에게 보낸 편지에서' },
    { t: '우리는 실제보다 상상 속에서 더 자주 괴로워한다.', s: '세네카, 『루킬리우스에게 보내는 편지』' },
    { t: '세상은 고통으로 가득하지만, 그것을 이겨내는 일로도 가득하다.', s: '헬렌 켈러, 『낙관주의』' },
    { t: '사람을 괴롭히는 것은 일 그 자체가 아니라, 그 일에 대한 생각이다.', s: '에픽테토스, 『엥케이리디온』' },
    { t: '바깥의 무언가 때문에 괴롭다면, 그 아픔은 일 자체가 아니라 그것을 판단한 내 생각에서 온다. 그리고 그 생각은 언제든 거둘 수 있다.', s: '마르쿠스 아우렐리우스, 『명상록』' },
    { t: '무슨 일이 오든, 시간은 가장 험한 날도 지나간다.', s: '셰익스피어, 『맥베스』' },
    { t: '천 리 길도 발밑의 한 걸음에서 시작된다.', s: '노자, 『도덕경』 64장' },
    { t: '쥐구멍에도 볕 들 날 있다.', s: '우리 속담' },
    { t: '오늘 힘들었던 일은 오늘의 일일 뿐, 나라는 사람 전체가 아니다.', s: '오늘의 확언' },
    { t: '나는 불편한 마음을 알아차렸고, 그것을 다른 장면으로 바꿔 볼 줄 안다.', s: '오늘의 확언' },
    { t: '내가 바랐던 장면은 내가 무엇을 소중히 여기는지 알려준다.', s: '오늘의 확언' },
    { t: '오늘을 버텨낸 나에게 충분히 수고했다고 말해 줄 수 있다.', s: '오늘의 확언' },
    { t: '나는 완벽하지 않아도 괜찮다. 오늘도 나름의 최선을 다했다.', s: '오늘의 확언' },
    { t: '짜증 난 순간이 지나가면, 나는 다시 나에게 돌아온다.', s: '오늘의 확언' },
    { t: '내일의 나는 오늘보다 조금 더 가벼울 것이다.', s: '오늘의 확언' }
  ];

  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const todayKey = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const wd = ['일', '월', '화', '수', '목', '금', '토'];
  document.getElementById('date').textContent =
    `${now.getFullYear()}. ${pad(now.getMonth() + 1)}. ${pad(now.getDate())} ${wd[now.getDay()]}요일`;

  // ---- storage ----
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || 'null') || null; } catch (e) { store = null; }
  if (!store) {
    store = {};
    try {
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || '{}') || {};
      Object.keys(old).forEach(k => {
        const items = (old[k].items || []).filter(i => i.neg && i.neg.trim()).map(i => ({
          neg: i.neg, pos: i.pos || '', state: i.inked ? 'inked' : 'written'
        }));
        const allInked = items.length && items.every(i => i.state === 'inked');
        store[k] = { items, done: k !== todayKey && allInked, quote: null };
      });
    } catch (e) {}
  }
  const fresh = () => ({ items: [{ neg: '', pos: '', state: 'write' }], done: false, quote: null });
  let today = store[todayKey] || fresh();
  if (!today.items.length && !today.done) today.items.push({ neg: '', pos: '', state: 'write' });
  function save() {
    store[todayKey] = today;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  const $ = id => document.getElementById(id);
  const list = $('list'), hint = $('hint'), actions = $('actions');
  const peekOpen = new Set();
  function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
  function btn(label, cls, fn) { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b; }
  const inked = () => today.items.filter(i => i.state === 'inked').length;
  const pending = () => today.items.filter(i => i.state === 'written').length;
  const last = () => today.items[today.items.length - 1];

  function updateStatus() {
    const dots = $('dots'); dots.innerHTML = '';
    for (let k = 0; k < MAX; k++) {
      const i = document.createElement('i');
      const it = today.items[k];
      if (it && it.state === 'inked') i.className = 'on';
      else if (it) i.className = 'wip';
      dots.append(i);
    }
    $('statusText').textContent = today.done ? `오늘 ${inked()}개를 덮어썼어요` : `덮은 일 ${inked()}개 · 최대 ${MAX}개`;

    const l = last();
    hint.hidden = false;
    if (today.done) hint.hidden = true;
    else if (l && l.state === 'write') hint.textContent = inked() ? '하나 더 적어볼까요? 다 적었으면 “다 썼어요”를 눌러요.' : '오늘 힘들었거나 짜증 났던 일을 하나 적어요. 솔직하게 써도 돼요.';
    else if (l && l.state === 'written') hint.textContent = '문장 위를 손가락으로 왼쪽 끝에서 오른쪽 끝까지 쭉 그어 까맣게 덮어요.';
    else if (l && l.state === 'inked' && !l.pos.trim()) hint.textContent = '까만 자리에 “이 일이 이랬으면 좋았을 텐데” 하는 장면을 적어요.';
    else hint.textContent = inked() < MAX ? '하나 더 적거나, 오늘은 여기까지 해도 괜찮아요.' : '다섯 개를 모두 덮었어요. 오늘의 일기를 완료해요.';
    renderActions();
  }

  function renderActions() {
    actions.innerHTML = '';
    if (today.done) {
      actions.append(btn('일기 다시 열기', 'ghost', () => { today.done = false; save(); render(); }));
      return;
    }
    const l = last();
    if (l && l.state === 'inked' && today.items.length < MAX) {
      actions.append(btn('+ 하나 더 쓰기', 'primary', () => {
        today.items.push({ neg: '', pos: '', state: 'write' }); save(); render();
        const t = list.querySelector('li:last-child textarea'); if (t) t.focus();
      }));
    }
    const canFinish = inked() > 0 && pending() === 0;
    const fin = btn('오늘의 일기 완료', 'done-btn', finishDay);
    fin.disabled = !canFinish;
    actions.append(fin);
    if (today.items.some(i => i.neg.trim())) {
      actions.append(btn('처음부터', 'ghost', () => {
        actions.innerHTML = '';
        const box = document.createElement('div'); box.className = 'confirm';
        box.append('오늘 쓴 내용이 모두 지워져요.');
        box.append(btn('지우기', '', () => { today = fresh(); save(); render(); }), btn('취소', 'ghost', renderActions));
        actions.append(box);
      }));
    }
  }

  function finishDay() {
    today.items = today.items.filter(i => i.state === 'inked');
    today.done = true;
    if (today.quote == null) today.quote = Math.floor(Math.random() * QUOTES.length);
    save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderQuote() {
    const q = $('quote');
    if (!today.done) { q.hidden = true; return; }
    q.hidden = false; q.innerHTML = '';
    const item = QUOTES[today.quote % QUOTES.length];
    const e = document.createElement('div'); e.className = 'eyebrow'; e.textContent = '오늘 수고한 나에게';
    const bq = document.createElement('blockquote'); bq.textContent = item.t;
    const c = document.createElement('cite'); c.textContent = '— ' + item.s;
    const row = document.createElement('div'); row.className = 'row-btn';
    row.append(btn('다른 문장 보기', '', () => {
      let n; do { n = Math.floor(Math.random() * QUOTES.length); } while (n === today.quote && QUOTES.length > 1);
      today.quote = n; save(); renderQuote();
    }));
    q.append(e, bq, c, row);
  }

  function render() {
    renderQuote();
    list.innerHTML = '';
    today.items.forEach((it, i) => {
      const li = document.createElement('li');
      const card = document.createElement('div'); card.className = 'card ' + it.state;
      const top = document.createElement('div'); top.className = 'top';
      const label = document.createElement('span'); label.textContent = `${i + 1}번째`;
      top.append(label);
      card.append(top); li.append(card); list.append(li);

      if (it.state === 'write') {
        const t = document.createElement('textarea');
        t.id = 'neg-' + i; t.rows = 1; t.value = it.neg;
        t.setAttribute('aria-label', `${i + 1}번째 싫었던 일`);
        t.placeholder = '예: 회의에서 내 말을 끊고 넘어갔다';
        const foot = document.createElement('div'); foot.className = 'foot';
        const go = btn('다 썼어요', 'chip go', () => { if (!it.neg.trim()) return; it.state = 'written'; save(); render(); });
        go.disabled = !it.neg.trim();
        t.addEventListener('input', () => { it.neg = t.value; go.disabled = !t.value.trim(); save(); autosize(t); });
        if (!it.neg && i === 0 && !inked()) foot.append(btn('예시로 써보기', 'chip', () => { it.neg = SAMPLE; save(); render(); }));
        if (today.items.length > 1) foot.append(btn('지우기', 'chip', () => { today.items.splice(i, 1); save(); render(); }));
        foot.append(go);
        card.append(t, foot);
        requestAnimationFrame(() => autosize(t));
        return;
      }

      if (it.state === 'written') {
        top.append(btn('고치기', 'chip', () => { it.state = 'write'; save(); render(); }));
        const strip = document.createElement('div'); strip.className = 'strip';
        const p = document.createElement('p'); p.className = 'neg'; p.textContent = it.neg;
        const c = document.createElement('canvas'); c.setAttribute('aria-hidden', 'true');
        const cue = document.createElement('div'); cue.className = 'swipe-cue';
        strip.append(p, c, cue);
        const foot = document.createElement('div'); foot.className = 'foot';
        foot.append(btn('버튼으로 덮기', 'chip', () => cover(it)));
        card.append(strip, foot);
        requestAnimationFrame(() => setupInk(strip, c, cue, it));
        return;
      }

      // inked
      const open = peekOpen.has(i);
      top.append(btn(open ? '원래 문장 숨기기' : '원래 문장 보기', 'chip', () => {
        open ? peekOpen.delete(i) : peekOpen.add(i); render();
      }));
      const pos = document.createElement('textarea');
      pos.className = 'pos'; pos.id = 'pos-' + i; pos.rows = 1; pos.value = it.pos;
      pos.setAttribute('aria-label', `${i + 1}번째 다시 쓴 장면`);
      pos.placeholder = '이랬으면 좋았을 텐데…';
      if (today.done) pos.readOnly = true;
      pos.addEventListener('input', () => { it.pos = pos.value; save(); autosize(pos); updateStatus(); });
      card.append(pos);
      if (open) {
        const pk = document.createElement('div'); pk.className = 'peek';
        const b = document.createElement('b'); b.textContent = '덮기 전 문장';
        pk.append(b, it.neg); card.append(pk);
      }
      requestAnimationFrame(() => autosize(pos));
    });
    updateStatus();
    renderHistory();
  }

  function cover(it) {
    if (it.state === 'inked') return;
    it.state = 'inked'; save(); render();
    setTimeout(() => {
      const t = list.querySelector('li:last-child .pos');
      if (t && !t.value) t.focus({ preventScroll: true });
    }, 350);
  }

  function setupInk(strip, c, cue, it) {
    const r = strip.getBoundingClientRect();
    if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#15191e';
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const W = r.width, H = r.height, brush = Math.max(30, H * 0.85);
    const N = 24, hit = new Array(N).fill(false);
    let lastP = null, drawing = false, done = false;
    const mark = x => {
      const a = Math.max(0, Math.floor((x - brush / 2) / W * N)), b = Math.min(N - 1, Math.floor((x + brush / 2) / W * N));
      for (let k = a; k <= b; k++) hit[k] = true;
    };
    const pt = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: Math.min(H - brush * .35, Math.max(brush * .35, e.clientY - b.top)) }; };
    function stroke(a, b) {
      ctx.lineWidth = brush * (0.92 + Math.random() * 0.16);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      const s = Math.ceil(Math.abs(b.x - a.x) / 6) || 1;
      for (let k = 0; k <= s; k++) mark(a.x + (b.x - a.x) * k / s);
      if (!done && hit.filter(Boolean).length >= N - 2) {
        done = true; ctx.fillRect(0, 0, W, H);
        setTimeout(() => cover(it), 140);
      }
    }
    c.addEventListener('pointerdown', e => { drawing = true; cue.remove(); lastP = pt(e); try { c.setPointerCapture(e.pointerId); } catch (_) {} stroke(lastP, { x: lastP.x + .1, y: lastP.y }); });
    c.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); stroke(lastP, p); lastP = p; });
    const end = () => { drawing = false; lastP = null; };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  }

  function renderHistory() {
    const box = $('history'); box.innerHTML = '';
    const keys = Object.keys(store).filter(k => k !== todayKey && store[k].items && store[k].items.some(i => i.state === 'inked')).sort().reverse().slice(0, 21);
    if (!keys.length) {
      const p = document.createElement('p'); p.className = 'none';
      p.textContent = '지난 날의 다시 쓴 장면들이 여기에 날짜별로 쌓여요. 눌러서 원래 문장도 볼 수 있어요.';
      box.append(p); return;
    }
    keys.forEach(k => {
      const d = document.createElement('div'); d.className = 'day';
      const h = document.createElement('div'); h.className = 'd'; h.textContent = k.replace(/-/g, '. ');
      const ul = document.createElement('ul');
      store[k].items.filter(i => i.state === 'inked').forEach(i => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        if (!i.pos.trim()) b.className = 'empty';
        b.textContent = i.pos.trim() || '덮기만 했어요';
        b.setAttribute('aria-expanded', 'false');
        b.onclick = () => {
          const o = b.querySelector('.orig');
          if (o) { o.remove(); b.setAttribute('aria-expanded', 'false'); }
          else { const s = document.createElement('span'); s.className = 'orig'; s.textContent = '덮기 전: ' + i.neg; b.append(s); b.setAttribute('aria-expanded', 'true'); }
        };
        li.append(b); ul.append(li);
      });
      d.append(h, ul); box.append(d);
    });
  }

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (pending()) render(); }, 200); });
  render();
})();
</script>

</body></html>
